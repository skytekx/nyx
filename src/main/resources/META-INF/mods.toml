[[mods]]
modId="nyx"
version="${file.jarVersion}"
displayName="Nyx"
authors="Ellpeck (original), SkyTekx (1.20.1 port)"
credits="Original mod by Ellpeck (https://github.com/Ellpeck/Nyx), MIT licensed."
description='''
Nyx, a mod about the effects of the moon. Adds lunar events (full, blood and
harvest moons and star showers), falling meteors and stars, lunar water and
gleaning crystals, meteor tools and armour, moon-scaled enchantments, and a
moon-phase-driven darker, tinted night sky.

Full 1.20.1 port of Ellpeck's Nyx.
'''

